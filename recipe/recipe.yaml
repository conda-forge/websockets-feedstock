# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "16.1"

package:
  name: websockets
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/w/websockets/websockets-${{ version }}.tar.gz
    sha256: 299468cbe42e2b9981134c7c51d99387d8a7bf562b00183b3eec53f882846dad
    target_directory: dist
  - url: https://github.com/python-websockets/websockets/archive/refs/tags/${{ version }}.tar.gz
    sha256: b3c787531ac46bce9733c03e600ef89e66b4fdd8683582fba1cf04d0ac14a155
    target_directory: src

build:
  number: 0
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - pip
    - python
    - setuptools
  run:
    - python

tests:
  - python:
      imports: websockets
      pip_check: true
  - files:
      source:
        - src/tests/
    requirements:
      run:
        - pytest-cov
        - werkzeug
    script:
      file: run_test.py

about:
  license: BSD-3-Clause
  license_file: dist/LICENSE
  summary: A library for developing WebSocket servers and clients in Python.
  description: |
    websockets is a library for developing WebSocket servers and clients in
    Python. It implements RFC 6455 with a focus on correctness and simplicity.
    It passes the Autobahn Testsuite. Built on top of asyncio, Python's
    standard asynchronous I/O framework, it provides a straightforward API
    based on coroutines, making it easy to write highly concurrent
    applications.
  homepage: https://websockets.readthedocs.io/en/stable/index.html
  repository: https://github.com/python-websockets/websockets
  documentation: https://websockets.readthedocs.io/en/stable/index.html

extra:
  recipe-maintainers:
    - scopatz
    - ocefpaf
    - bollwyvl
